version: '3'

tasks:
  build-image:
    desc: Build the karyon/k3s-cuda custom image (IMG-01..06)
    cmds:
      - bash scripts/build-image.sh

  create-clusters:
    desc: Create k8s-net + three k3d clusters (CLU-01..05)
    cmds:
      - bash scripts/create-clusters.sh

  delete-clusters:
    desc: Remove clusters + k8s-net; preserve karyon/k3s-cuda image (CLU-06, D-14)
    cmds:
      - bash scripts/delete-clusters.sh

  bootstrap-flux:
    desc: Bootstrap Flux GitOps on k3d-hub-flux from clusters/hub-flux/ (FLUX-01..04)
    cmds:
      - bash scripts/bootstrap-flux.sh

  register-spokes:
    desc: Register spoke clusters for Flux reconciliation via spec.kubeConfig (SPOKE-01..06)
    cmds:
      - bash scripts/register-spokes-for-flux.sh

  deploy-examples:
    desc: Deploy podinfo to spoke-apps and GPU smoke Job to spoke-ml via Flux
    cmds:
      - bash scripts/deploy-examples.sh

  fix-dns:
    desc: Stop/start hub-flux to refresh stale k3d CoreDNS NodeHosts
    cmds:
      - bash scripts/fix-coredns.sh

  health-check:
    desc: Verify clusters, Flux, spokes, DNS, GPU capacity, TLS SANs, and examples
    cmds:
      - bash scripts/health-check.sh
