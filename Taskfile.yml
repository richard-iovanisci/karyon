version: '3'

tasks:
  preflight:
    desc: Read-only environment check (PRE-01..14); idempotent, exits 0 on pass / 1 on any blocker
    cmds:
      - bash scripts/preflight.sh

  build-image:
    desc: Build the karyon/k3s-cuda custom image (IMG-01..06)
    cmds:
      - bash scripts/build-image.sh

  create-clusters:
    desc: Create k8s-net + three k3d clusters (CLU-01..05)
    cmds:
      - bash scripts/create-clusters.sh

  delete-clusters:
    desc: Remove clusters + k8s-net; preserve karyon/k3s-cuda image (CLU-06, D-14)
    cmds:
      - bash scripts/delete-clusters.sh

  bootstrap-flux:
    desc: Bootstrap Flux GitOps on k3d-hub-flux from clusters/hub-flux/ (FLUX-01..04)
    cmds:
      - bash scripts/bootstrap-flux.sh

  register-spokes:
    desc: Register spoke clusters for Flux reconciliation via spec.kubeConfig (SPOKE-01..06)
    cmds:
      - bash scripts/register-spokes-for-flux.sh

  deploy-examples:
    desc: Deploy podinfo to spoke-apps and GPU smoke Job to spoke-ml via Flux
    cmds:
      - bash scripts/deploy-examples.sh

  fix-dns:
    desc: Stop/start hub-flux to refresh stale k3d CoreDNS NodeHosts
    cmds:
      - bash scripts/fix-coredns.sh

  fix-dns-poc-capsule:
    desc: Stop/start spoke-capsule to refresh stale k3d CoreDNS NodeHosts (POC; does NOT affect default fix-dns)
    cmds:
      - bash scripts/poc/capsule/fix-dns.sh

  health-check:
    desc: Verify clusters, Flux, spokes, DNS, GPU capacity, TLS SANs, and examples
    cmds:
      - bash scripts/health-check.sh

  destroy:
    desc: Confirm and remove all k3d clusters plus k8s-net while preserving CUDA cache
    cmds:
      - bash scripts/destroy.sh

  rebuild:
    desc: Full destructive rebuild ending in health-check under 20 minutes with warm cache
    cmds:
      - bash scripts/rebuild.sh

  fail-capsule-webhook:
    desc: (POC) Scale capsule-controller-manager to N replicas (test-only failure simulation; usage `task fail-capsule-webhook -- 0|1`)
    cmds:
      - bash scripts/poc/capsule/fail-capsule-webhook.sh {{.CLI_ARGS}}

  destroy-poc:
    desc: (POC) Ordered teardown for a named POC (usage `task destroy-poc -- capsule [--full]`)
    cmds:
      - bash scripts/poc/capsule/destroy-poc.sh {{.CLI_ARGS}}
