<svg width="680" height="650" viewBox="0 0 680 650" role="img" xmlns="http://www.w3.org/2000/svg">
<title>EKS OIDC runtime auth flow</title>
<desc>Sequence diagram: workstation logs in to Keycloak with PKCE, receives an ID token, sends requests to capsule-proxy, which TokenReviews against the EKS apiserver; the apiserver validates the token offline against cached JWKS, the proxy filters cluster-scoped lists to owned tenants, and RBAC plus Capsule webhooks authorize the proxied request.</desc>
<defs>
<marker id="mP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7F77DD"/></marker>
<marker id="mT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D9E75"/></marker>
<marker id="mC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D85A30"/></marker>
<marker id="mG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888780"/></marker>
<style>
text { font-family: Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.lbl { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
</style>
</defs>
<rect x="0" y="0" width="680" height="650" fill="#ffffff"/>
<line x1="107.5" y1="88" x2="107.5" y2="630" stroke="#B4B2A9" stroke-width="1"/>
<line x1="262.5" y1="88" x2="262.5" y2="630" stroke="#B4B2A9" stroke-width="1"/>
<line x1="417.5" y1="88" x2="417.5" y2="630" stroke="#B4B2A9" stroke-width="1"/>
<line x1="572.5" y1="88" x2="572.5" y2="630" stroke="#B4B2A9" stroke-width="1"/>
<rect x="40" y="40" width="135" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="107.5" y="60" text-anchor="middle" class="th" fill="#444441">Workstation</text>
<text x="107.5" y="78" text-anchor="middle" class="ts" fill="#5F5E5A">kubectl · Headlamp</text>
<rect x="195" y="40" width="135" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="262.5" y="60" text-anchor="middle" class="th" fill="#3C3489">Keycloak</text>
<text x="262.5" y="78" text-anchor="middle" class="ts" fill="#534AB7">private internal LB</text>
<rect x="350" y="40" width="135" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="417.5" y="60" text-anchor="middle" class="th" fill="#085041">capsule-proxy</text>
<text x="417.5" y="78" text-anchor="middle" class="ts" fill="#0F6E56">tenant front door</text>
<rect x="505" y="40" width="135" height="48" rx="4" fill="#FAECE7" stroke="#993C1D"/>
<text x="572.5" y="60" text-anchor="middle" class="th" fill="#712B13">EKS apiserver</text>
<text x="572.5" y="78" text-anchor="middle" class="ts" fill="#993C1D">+ Capsule admission</text>
<line x1="572.5" y1="125" x2="268" y2="125" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mP)"/>
<text x="340" y="118" text-anchor="middle" class="lbl">0 · JWKS fetch</text>
<text x="340" y="141" text-anchor="middle" class="lbl">via VPC egress</text>
<line x1="107.5" y1="180" x2="257" y2="180" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#mP)"/>
<text x="185" y="173" text-anchor="middle" class="lbl">1 · PKCE login</text>
<line x1="262.5" y1="215" x2="113" y2="215" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#mP)"/>
<text x="185" y="208" text-anchor="middle" class="lbl">2 · ID token</text>
<text x="185" y="231" text-anchor="middle" class="lbl">aud · username · groups</text>
<line x1="107.5" y1="260" x2="412" y2="260" stroke="#888780" stroke-width="1.5" marker-end="url(#mG)"/>
<text x="185" y="253" text-anchor="middle" class="lbl">3 · request + token</text>
<line x1="417.5" y1="305" x2="567" y2="305" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#mT)"/>
<text x="495" y="298" text-anchor="middle" class="lbl">4 · TokenReview</text>
<rect x="505" y="330" width="135" height="44" rx="4" fill="#FAECE7" stroke="#993C1D"/>
<text x="572.5" y="348" text-anchor="middle" class="th" fill="#712B13">5 · verify offline</text>
<text x="572.5" y="364" text-anchor="middle" class="ts" fill="#993C1D">sig, iss, aud, exp</text>
<line x1="572.5" y1="410" x2="423" y2="410" stroke="#D85A30" stroke-width="1.5" marker-end="url(#mC)"/>
<text x="495" y="403" text-anchor="middle" class="lbl">6 · user + groups</text>
<rect x="350" y="435" width="135" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="417.5" y="453" text-anchor="middle" class="th" fill="#085041">7 · filter LISTs</text>
<text x="417.5" y="469" text-anchor="middle" class="ts" fill="#0F6E56">to owned tenants</text>
<line x1="417.5" y1="515" x2="567" y2="515" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#mT)"/>
<text x="495" y="508" text-anchor="middle" class="lbl">8 · forward request</text>
<rect x="505" y="540" width="135" height="44" rx="4" fill="#FAECE7" stroke="#993C1D"/>
<text x="572.5" y="558" text-anchor="middle" class="th" fill="#712B13">9 · authorize</text>
<text x="572.5" y="574" text-anchor="middle" class="ts" fill="#993C1D">RBAC and webhooks</text>
<line x1="572.5" y1="615" x2="113" y2="615" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mG)"/>
<text x="185" y="608" text-anchor="middle" class="lbl">filtered response</text>
</svg>
