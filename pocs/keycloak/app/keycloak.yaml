# pocs/keycloak/app/keycloak.yaml
# Keycloak instance CR, reconciled by the vendored operator (26.6.4).
#
# Posture (documented in docs/poc-keycloak.md + docs/tenant-access.md):
# - OIDC WIRED (2026-07-06, tenant-ui-oidc quick task): TLS via the imperative
#   keycloak-tls Secret (scripts/poc/keycloak/create-tls.sh — certs never in
#   git) and the issuer pinned to https://localhost:31443. That URL was
#   LIVE-VERIFIED as the only https origin valid from all vantage points:
#   Windows browser (WSL mirrored networking shares localhost), WSL host
#   (docker-proxy publishes 31443 via the socat forwarder), the spoke
#   apiserver AND hostNetwork pods (kube-proxy serves NodePorts on node
#   loopback in k3s iptables mode). host.k3d.internal is NXDOMAIN in this
#   lab — do not resurrect it.
# - http.httpEnabled stays true: in-cluster consumers + the plain port-forward
#   UI path keep working on 8080; 8443 serves the pinned-issuer TLS side.
# - hostname.strict: false + explicit hostname: token `iss` is byte-stable at
#   https://localhost:31443 for kubelogin, Headlamp, and the apiserver.
# - db: the operator does not manage databases; postgres-db is the vendored
#   StatefulSet in ../spoke/postgres/, credentials from the script-applied
#   Secret keycloak-db-secret (scripts/poc/keycloak/create-secrets.sh).
# - resources: Keycloak defaults request 1700MiB — trimmed for the k3d/WSL2
#   lab; startupProbe stretched because Keycloak cold-boot on WSL2 is slow.
# - The operator auto-creates Secret `keycloak-initial-admin` (keys
#   username/password) for first login — retrieval command in the docs.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    karyon.io/poc: keycloak
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgres-db
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: true
    httpPort: 8080
    tlsSecret: keycloak-tls
  hostname:
    hostname: https://localhost:31443
    strict: false
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  startupProbe:
    periodSeconds: 10
    failureThreshold: 60
