# pocs/capsule/kustomization.yaml
# Aggregator for the capsule POC tree, reconciled by the outer Flux Kustomization
# (clusters/hub-flux/pocs/capsule.yaml, spec.path: ./pocs/capsule). This file must
# exist even with an empty resource list — without it the outer Kustomization
# reports Ready=False (path not found).
#
# operator/ and proxy/ are SEPARATE charts: capsule-proxy installs from its own
# per-chart OCIRepository + HelmRelease, NOT via the capsule umbrella chart's
# proxy.enabled flag (the umbrella pins an older capsule-proxy).
#
# tenants/ holds the hub-targeted per-tenant inner Flux Kustomization CRs +
# per-tenant Namespaces + per-tenant GitRepositories. CapsuleConfiguration +
# Tenant CRs land via the spoke-targeted poc-capsule-spoke outer K
# (path ./pocs/capsule/spoke).
#
# namespace.yaml is listed first (2026-05-06) so the capsule-system Namespace
# exists on hub before HelmRelease/OCIRepository CRs are applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- operator/
- proxy/
- tenants/
