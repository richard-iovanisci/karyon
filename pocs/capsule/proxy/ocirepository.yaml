# pocs/capsule/proxy/ocirepository.yaml
# capsule-proxy chart source — Flux v1 OCIRepository pinning oci://ghcr.io/projectcapsule/charts/capsule-proxy:0.12.0
#
# Verified shapes (2026-04-29):
#   - apiVersion source.toolkit.fluxcd.io/v1: fluxcd.io/flux/components/source/api/v1/
#   - chart values surface: helm show values oci://ghcr.io/projectcapsule/charts/capsule-proxy --version 0.12.0
#
# Per-chart OCIRepository (NOT shared with operator; operator has its own at pocs/capsule/operator/ocirepository.yaml)
# capsule-proxy is a SEPARATE chart, NOT the umbrella's `proxy.enabled: true` (umbrella pins capsule-proxy at 0.10.0)
# Digest-pinned (matching the operator pattern; see docs/rca/capsule-namespace-webhook-deadlock.md):
#   tag "0.12.0" tracks Capsule v0.12.4 but is MUTABLE; digest is authoritative per OCI spec.
#   Current digest captured 2026-05-27 from `kubectl -n capsule-system get ocirepository capsule-proxy -o jsonpath='{.status.artifact.revision}'`.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: capsule-proxy
  namespace: capsule-system
spec:
  interval: 24h
  url: oci://ghcr.io/projectcapsule/charts/capsule-proxy
  ref:
    tag: "0.12.0"
    digest: "sha256:0b8c6ef4a74425c8bd4c0e383cf1847042580ca4071db2ed07b3c26bc0b0d02d"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
