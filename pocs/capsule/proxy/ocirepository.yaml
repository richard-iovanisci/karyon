# pocs/capsule/proxy/ocirepository.yaml
# capsule-proxy chart source — Flux v1 OCIRepository pinning oci://ghcr.io/projectcapsule/charts/capsule-proxy:0.12.0
#
# Verified shapes (2026-04-29):
#   - apiVersion source.toolkit.fluxcd.io/v1: fluxcd.io/flux/components/source/api/v1/
#   - chart values surface: helm show values oci://ghcr.io/projectcapsule/charts/capsule-proxy --version 0.12.0
#
# D-08-02 — per-chart OCIRepository (NOT shared with operator; operator has its own at pocs/capsule/operator/ocirepository.yaml)
# Milestone-open: capsule-proxy is a SEPARATE chart, NOT the umbrella's `proxy.enabled: true` (umbrella pins capsule-proxy at 0.10.0)
# CAP-02 — tag literal "0.12.0" tracks Capsule v0.12.4 (release notes confirm `update module github.com/projectcapsule/capsule to v0.12.4`)
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: capsule-proxy
  namespace: capsule-system
spec:
  interval: 24h
  url: oci://ghcr.io/projectcapsule/charts/capsule-proxy
  ref:
    tag: "0.12.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
