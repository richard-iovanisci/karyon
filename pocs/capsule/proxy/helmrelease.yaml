# pocs/capsule/proxy/helmrelease.yaml
# capsule-proxy install — Flux v2 HelmRelease that helm-controller (on hub-flux) reconciles
# onto k3d-spoke-capsule via spec.kubeConfig (hub-only Flux control plane preserved —
# see docs/adr/0004-hub-only-flux-control-plane.md).
#
# Verified shapes (2026-04-29):
#   - apiVersion helm.toolkit.fluxcd.io/v2: fluxcd.io/flux/components/helm/api/v2/
#   - chart values key paths: helm show values oci://ghcr.io/projectcapsule/charts/capsule-proxy --version 0.12.0
#
# Key choices:
#   - spec.interval=5m matches outer poc-capsule Kustomization cadence
#   - spec.dependsOn blocks reconcile until operator HelmRelease Ready=True
#     (NO `wait:` field — the field doesn't exist in helm.toolkit.fluxcd.io/v2;
#     default behavior already blocks until dependency Ready=True)
#   - spec.kubeConfig.secretRef.{name,key} matches the spoke-targeted outer
#     Kustomizations (secret key value.yaml)
#   - Reachability contract: NodePort 30443 reachable from the WSL host means
#     TLS handshake succeeds + HTTP code in [1-5][0-9][0-9], NOT a literal
#     /healthz 200 against chart defaults
#   - TLS SANs use the options.additionalSANs key path (verified; NOT tls.additionalSANs)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capsule-proxy
  namespace: capsule-system
spec:
  interval: 5m
  releaseName: capsule-proxy
  targetNamespace: capsule-system
  storageNamespace: capsule-system
  # spec.serviceAccountName (2026-05-06) tells helm-controller which SA to
  # impersonate ON the target cluster (spoke-capsule via spec.kubeConfig).
  # Without this, helm-controller defaults to system:serviceaccount:capsule-system:default
  # which has zero RBAC; flux reconcile times out with `context deadline exceeded`.
  # The SA + cluster-admin CRB are provisioned on spoke by pocs/capsule/spoke/rbac/
  # which lands FIRST via clusters/hub-flux/pocs/capsule-spoke-rbac.yaml (a separate
  # top-level Flux Kustomization with NO dependsOn on poc-capsule, ensuring inter-K
  # ordering).
  serviceAccountName: helm-controller
  install:
    # capsule-system is bootstrapped by poc-capsule-spoke-rbac. Leaving Helm
    # namespace creation enabled causes Helm to patch the existing namespace
    # after Capsule's namespace webhook is active, which Capsule rejects for
    # this non-tenant system namespace.
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: capsule-proxy
  kubeConfig:
    secretRef:
      name: spoke-capsule-kubeconfig
      key: value.yaml
  # Proxy waits for operator HelmRelease Ready=True before reconciling.
  # dependsOn does NOT support a `wait: true` sub-field — Flux v2 HelmRelease
  # default behavior already blocks until dependency Ready=True.
  dependsOn:
    - name: capsule
      namespace: capsule-system
  values:
    # Service shape — NodePort 30443, published on the k3d serverlb so the WSL
    # host can reach the proxy
    service:
      type: NodePort
      port: 9001
      portName: proxy
      nodePort: 30443
    # TLS SAN injection. Verified key path: options.additionalSANs
    # (NOT tls.additionalSANs). Without 127.0.0.1 + localhost SANs, curl -k from
    # the WSL host fails the TLS handshake at the cert hostname-verification step
    # (before the HTTP request even starts).
    # Cert source (2026-04-29) = chart's controller-less self-sign Job.
    # The original choice (`certManager.generateCertificates: true`) was falsified
    # live: that path renders cert-manager.io `Issuer` + `Certificate` CRs which
    # REQUIRE the cert-manager *controller* (not just CRDs) to reconcile into the
    # `capsule-proxy` Secret. This cluster installs the cert-manager.io CRDs as
    # API surface only — no controller — so those CRs would sit indefinitely
    # unreconciled and the proxy pod would never mount its TLS volume.
    #
    # The fix: flip to `options.generateCertificates: true` + `certManager.generateCertificates: false`,
    # which renders the chart's `capsule-proxy-certgen` Job (uses kube-webhook-certgen image
    # to produce a self-signed Secret directly, controller-less). Verified by:
    #   helm template oci://ghcr.io/projectcapsule/charts/capsule-proxy --version 0.12.0 \
    #     --set options.generateCertificates=true --set certManager.generateCertificates=false \
    #     | grep -E '^kind: ' | sort | uniq -c
    # Renders 2 Jobs (capsule-proxy-certgen + capsule-proxy-crds), 0 Issuer, 0 Certificate.
    # The operator HelmRelease is unaffected (the operator's tls.enableController
    # is that chart's separate controller-less self-sign path).
    options:
      listeningPort: 9001
      enableSSL: true
      generateCertificates: true   # controller-less certgen Job; produces capsule-proxy Secret
      capsuleConfigurationName: default
      additionalSANs:
        - 127.0.0.1
        - localhost
      authPreferredTypes: "BearerToken,TLSCertificate"
    certManager:
      generateCertificates: false   # do NOT render cert-manager.io Issuer/Certificate CRs
    webhooks:
      enabled: false
    replicaCount: 1
  # RBAC patch (2026-05-06), relocated here from clusters/hub-flux/pocs/capsule.yaml
  # spec.patches — Kustomization patches only touch kustomize-build output, while
  # postRenderers applies Kustomize-style patches to helm-rendered chart output,
  # which is the correct mechanism for extending chart-rendered Role objects.
  # Extends Role capsule-proxy:capsule-proxy with secrets {get,create,update,patch}
  # so kube-webhook-certgen Job can write its output Secret on initial Flux reconcile.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Role
              name: capsule-proxy:capsule-proxy
              namespace: capsule-system
            patch: |
              - op: add
                path: /rules/-
                value:
                  apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["get", "create", "update", "patch"]
