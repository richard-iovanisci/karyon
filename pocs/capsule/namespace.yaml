# pocs/capsule/namespace.yaml
# Creates the capsule-system namespace on hub-flux so kustomize-controller
# can apply HelmRelease + OCIRepository CRs (which declare metadata.namespace:
# capsule-system) without "namespaces capsule-system not found" errors.
#
# Note (2026-05-06) -- The HelmRelease install.createNamespace: true
# creates capsule-system on the TARGET cluster (spoke-capsule via spec.kubeConfig),
# NOT on the SOURCE cluster (hub-flux where kustomize-controller applies the CR).
# This Namespace resource ensures capsule-system exists on hub before the CRs land.
apiVersion: v1
kind: Namespace
metadata:
  name: capsule-system
