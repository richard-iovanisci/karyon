# pocs/capsule/tenants/alpha.yaml
# Hub-targeted: per-tenant Namespace (tenant-alpha on hub) +
# per-tenant GitRepository + per-tenant inner Kustomization.
#
# The hub-side tenant ns mirrors the spoke-side name (required so the
# Kustomization CR has a home AND so Flux's same-namespace impersonation
# rule resolves: SA gitops-reconciler in tenant-alpha on TARGET cluster).
#
# CRITICAL: spec.kubeConfig.secretRef.name "spoke-capsule-kubeconfig"
# MUST exist in tenant-alpha namespace on hub (NOT just flux-system).
# scripts/register-poc-cluster.sh imperatively mirrors the Secret. Without the mirror,
# the Kustomization reaches Ready=False with `secret "spoke-capsule-kubeconfig" not found`.
# Verifier tests/bats/tenants-09-live-inner-k-ready.bats catches this.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-alpha
---
# Per-tenant GitRepository. Lives in tenant-alpha namespace so the
# Kustomization's sourceRef survives --no-cross-namespace-refs lockdown.
#
# 2026-07-06 — secretRef added: the original design assumed anonymous
# HTTPS clone while the repo was public, but the repo later went private,
# which left this source Ready=False ("authentication required") and starved
# tenant-alpha-app for ~40 days before anyone noticed.
# scripts/register-poc-cluster.sh now mirrors the bootstrap git credential
# into this namespace as `karyon-git-auth` (same pattern as the
# spoke-capsule-kubeconfig mirror — Flux secretRef is same-namespace-only).
# The secretRef also works if the repo is later flipped back to public.
#
# The repo URL/owner is hard-coded; postBuild substituteFrom would require a
# cross-namespace ConfigMap mirror.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tenant-alpha-source
  namespace: tenant-alpha
spec:
  interval: 5m
  url: https://github.com/richard-iovanisci/karyon
  secretRef:
    name: karyon-git-auth
  ref:
    branch: main
---
# Per-tenant inner Kustomization. CARRIES A LOAD-BEARING DEFENSE:
# every tenant Flux Kustomization MUST set spec.serviceAccountName explicitly so
# cross-cluster reconciles impersonate the tenant owner SA instead of falling
# through to the kubeConfig principal (cluster-admin), which would bypass
# Capsule's tenant boundary entirely.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant-alpha-app
  namespace: tenant-alpha
spec:
  interval: 5m
  path: ./pocs/capsule/tenants/alpha-app
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: tenant-alpha-source
    # Same namespace (tenant-alpha) — survives --no-cross-namespace-refs
  kubeConfig:
    secretRef:
      name: spoke-capsule-kubeconfig
      # Same namespace (tenant-alpha) — Flux secretRef is same-namespace-only;
      # scripts/register-poc-cluster.sh mirrors the Secret imperatively.
      key: value.yaml
  serviceAccountName: gitops-reconciler  # LOAD-BEARING: impersonate the tenant SA, never the kubeConfig principal
  dependsOn:
    - name: poc-capsule
      namespace: flux-system
