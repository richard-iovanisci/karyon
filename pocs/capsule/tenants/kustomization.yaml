# pocs/capsule/tenants/kustomization.yaml
# Aggregator for hub-targeted tenant resources.
#
# Hub-targeted: parent pocs/capsule/kustomization.yaml resolves this under the
# poc-capsule outer K (NO kubeConfig — split-path pattern; CRs land on the hub
# apiserver).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alpha.yaml
  - bravo.yaml
  - alpha-app/
  - bravo-app/
