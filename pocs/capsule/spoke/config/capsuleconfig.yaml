# pocs/capsule/spoke/config/capsuleconfig.yaml
# CapsuleConfiguration "default" singleton (cluster-scoped policy CR
# Capsule webhooks consult on every tenant op).
#
# CRD schema verification (v0.12.4):
#   - apiVersion: capsule.clastix.io/v1beta2
#   - REQUIRED field: spec.enableTLSReconciler (boolean). Set false because the
#     operator chart's tls.enableController: true handles cert reconciliation
#     via the chart's controller-less self-sign Job, not via this flag.
#   - spec.forceTenantPrefix: top-level (line 80 of CRD)
#   - spec.allowServiceAccountPromotion: top-level (line 67)
#   - spec.userGroups: DEPRECATED in v1beta2 but kept for chart-default compatibility
#
# forceTenantPrefix: true is REQUIRED for namespace prefix enforcement
# (Tenant CR's spec.forceTenantPrefix overrides this per tenant).
apiVersion: capsule.clastix.io/v1beta2
kind: CapsuleConfiguration
metadata:
  name: default
spec:
  # REQUIRED by CRD schema
  enableTLSReconciler: false
  # Global namespace prefix enforcement
  forceTenantPrefix: true
  # Canonical clastix default; allows SA → owner promotion via labels
  # (allows gitops-reconciler SA to escalate identity inside its own tenant)
  allowServiceAccountPromotion: true
  # Owner-group filter (chart default, extended so SA-token-authenticated
  # identities are recognized as Capsule-owned for proxy LIST behavior).
  # The first 3 groups were originally patched onto the live CapsuleConfiguration;
  # this repo edit makes the GitOps source canonical (single source of truth --
  # reads exactly like the live cluster state). NOTE: userGroups is DEPRECATED in
  # v1beta2 (replaced by spec.users), but the capsule chart still uses this for
  # default group-based owner detection. Keeping for compatibility; may switch to
  # spec.users later.
  userGroups:
    - capsule.clastix.io
    - system:serviceaccounts
    - system:authenticated
    # 2026-07-06: OIDC group scope, appended so
    # the Keycloak `karyon` realm groups work as Capsule identities the moment
    # apiserver OIDC wiring lands (a Group promoted to Tenant owner MUST also
    # be in this scope — projectcapsule.dev/docs/tenants/permissions).
    # capsule-platform-owners is ALREADY a Group owner on alpha/bravo/keycloak.
    # These names match the Keycloak realm groups byte-for-byte (the realm's
    # group mapper emits bare names — full.path OFF — never "/name" paths).
    - capsule-users
    - capsule-platform-owners
    - tenant-alpha-devs
    - tenant-bravo-devs
  # Defense-in-depth: tenant cannot register kube-* namespace as a tenant ns.
  # (Capsule's own webhooks already block this; explicit makes intent clear.)
  protectedNamespaceRegex: ^kube-.*$
  # POC keeps these empty — the negative-RBAC suite may exercise them.
  nodeMetadata:
    forbiddenAnnotations: {}
    forbiddenLabels: {}
