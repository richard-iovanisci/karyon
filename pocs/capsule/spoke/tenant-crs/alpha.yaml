# pocs/capsule/spoke/tenant-crs/alpha.yaml
# Tenant CR alpha. Multi-owner (SA + User).
# - SA owner (system:serviceaccount:tenant-alpha:gitops-reconciler): drives the Flux
#   impersonation chain — every tenant inner K runs as the SA via Flux's
#   spec.serviceAccountName impersonation on the target cluster.
# - User owner (alpha): `kubectl --as=alpha create namespace
#   alpha-app1` works because the impersonated identity matches a Tenant owner.
#
# CRD schema verification (v0.12.4):
#   - apiVersion: capsule.clastix.io/v1beta2 (storage version)
#   - spec.forceTenantPrefix: TOP-LEVEL (NOT under namespaceOptions)
#   - spec.owners[].kind: enum User|Group|ServiceAccount
#   - spec.owners[].name: ServiceAccount uses system:serviceaccount:<ns>:<sa> combined format
#   - spec.owners[].namespace: DOES NOT EXIST in v1beta2 schema
apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: alpha
spec:
  # false preserves the established tenant-alpha home namespace. With true,
  # Capsule expects alpha-tenant-alpha and rejects the tenant-<name>
  # namespace contract.
  forceTenantPrefix: false
  # Multi-owner array
  owners:
    # Bootstrap Flux path: poc-capsule-spoke applies tenant-alpha
    # Namespace as flux-system/flux-reconciler. Capsule requires namespace
    # assignment to be performed by a Tenant owner, even when Kubernetes RBAC is
    # cluster-admin.
    - kind: ServiceAccount
      name: system:serviceaccount:flux-system:flux-reconciler
    # Flux impersonation chain (tenant inner Ks impersonate this SA)
    - kind: ServiceAccount
      name: system:serviceaccount:tenant-alpha:gitops-reconciler
      # Default clusterRoles: [admin, capsule-namespace-deleter] auto-applied
    # Human/CLI testing (`kubectl --as=alpha`)
    - kind: User
      name: alpha
    # === Tier 3 human-exercised tenant owner ===
    # Binds via Capsule auto-injected RoleBinding capsule-alpha-<index>-tenant-workload-editor.
    # clusterRoles MUST be non-empty (NEVER `clusterRoles: []` — that
    # removes all bindings; OMIT field for Capsule default, OR list explicit roles).
    - kind: ServiceAccount
      name: system:serviceaccount:tenant-alpha:human-tenant-owner
      clusterRoles:
        - tenant-workload-editor
    # === Tier 2 platform-owner co-ownership ===
    # Group impersonation path (kubectl --as=... --as-group=capsule-platform-owners)
    # AND SA-token kubeconfig path (issue-platform-owner-kubeconfig.sh). Both use
    # Capsule's default clusterRoles: [admin, capsule-namespace-deleter] —
    # broader than tenant-workload-editor / narrower than cluster-admin = Tier 2.
    # capsule-proxy LIST filter matches on owner-set membership.
    # OMIT the clusterRoles field for Capsule defaults (NEVER `[]`).
    - kind: Group
      name: capsule-platform-owners
    - kind: ServiceAccount
      name: system:serviceaccount:capsule-system:platform-owner
    # 2026-07-06: OIDC dev group as Tier-3 owner.
    # Keycloak realm karyon group `tenant-alpha-devs` (flat name; the client
    # groups mapper emits bare names — full.path OFF) exact-matches this
    # entry once the apiserver resolves OIDC tokens. Same Tier-3 ceiling as
    # human-tenant-owner: tenant-workload-editor, never Capsule defaults.
    # The group is ALSO in CapsuleConfiguration userGroups (required for
    # Group-kind owners). ADDITIVE only (delivery-03 guard).
    - kind: Group
      name: tenant-alpha-devs
      clusterRoles:
        - tenant-workload-editor
  # ResourceQuota auto-materialization shape
  # Capsule reconciles these into ResourceQuota objects in tenant namespaces
  # named capsule-<tenant>-<index>. Static checks verify SHAPE only; enforcement
  # semantics are exercised by the live quota-violation bats.
  resourceQuotas:
    items:
      - hard:
          cpu: "4"
          memory: 8Gi
          pods: "20"
  # LimitRange auto-materialization shape
  limitRanges:
    items:
      - limits:
          - type: Container
            default:
              cpu: 100m
              memory: 128Mi
            defaultRequest:
              cpu: 50m
              memory: 64Mi
  # Namespace-quota fixture for the negative-RBAC suite:
  # tenant-alpha (home) + alpha-app1 = 2; the bats creates alpha-app2 (3rd, OK)
  # then alpha-app3 (4th, REJECTED with a Capsule webhook quota error).
  # Schema: NamespaceOptions struct: Quota *int32 (kubebuilder:Minimum=1).
  namespaceOptions:
    quota: 3
  # Registry-allowlist fixture for the negative-RBAC suite: the bats asserts the
  # webhook rejects images from a registry outside this allowlist.
  # Schema: AllowedListSpec struct: { allowed: []string, allowedRegex: string }.
  # NOTE: ContainerRegistries field is marked deprecated in v0.12.4 (use Enforcement.Registries)
  # but the deprecated form still works for POC purposes.
  containerRegistries:
    allowed:
      - registry.example.io
      # Required for FQCI nginx Pod propagation by the GlobalTenantResource
      # (the negative-RBAC registry fixture continues to assert rejection
      # of an arbitrary other registry — additive).
      - docker.io
  # No additionalRoleBindings, storageClasses, ingressClasses, nodeSelector, networkPolicies --
  # Capsule defaults to allow-all.
