# pocs/capsule/spoke/tenants/bravo/tenant.yaml
# TEN-01 — Tenant CR bravo. Multi-owner (SA + User) per CONTEXT.md D-09-02.
# - SA owner (system:serviceaccount:tenant-bravo:gitops-reconciler): drives Flux impersonation
#   chain (TEN-04 P27 defense — every tenant inner K runs as the SA via Flux's
#   spec.serviceAccountName impersonation on the target cluster).
# - User owner (bravo): drives TEN-02 literal contract — `kubectl --as=bravo create namespace
#   bravo-app1` works because the impersonated identity matches a Tenant owner.
#
# CRD schema verification (v0.12.4) — RESEARCH Gap 4 corrections to CONTEXT.md:
#   - apiVersion: capsule.clastix.io/v1beta2 (storage version)
#   - spec.forceTenantPrefix: TOP-LEVEL (NOT under namespaceOptions — RESEARCH §Gap 4 correction)
#   - spec.owners[].kind: enum User|Group|ServiceAccount
#   - spec.owners[].name: ServiceAccount uses system:serviceaccount:<ns>:<sa> combined format
#   - spec.owners[].namespace: DOES NOT EXIST in v1beta2 schema
apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: bravo
spec:
  # D-11-07 live repair — false preserves the established tenant-bravo home
  # namespace. With true, Capsule expects bravo-tenant-bravo and rejects the
  # Phase 9 tenant-<name> namespace contract.
  forceTenantPrefix: false
  # TEN-01 — multi-owner array
  owners:
    # Bootstrap Flux path (D-11-07): poc-capsule-spoke applies tenant-bravo
    # Namespace as flux-system/flux-reconciler. Capsule requires namespace
    # assignment to be performed by a Tenant owner, even when Kubernetes RBAC is
    # cluster-admin.
    - kind: ServiceAccount
      name: system:serviceaccount:flux-system:flux-reconciler
    # Flux impersonation chain (TEN-04 P27 defense)
    - kind: ServiceAccount
      name: system:serviceaccount:tenant-bravo:gitops-reconciler
      # Default clusterRoles: [admin, capsule-namespace-deleter] auto-applied
    # Human/CLI testing (TEN-02 `kubectl --as=bravo`)
    - kind: User
      name: bravo
  # TEN-03 — ResourceQuota auto-materialization shape
  # Capsule reconciles these into ResourceQuota objects in tenant namespaces
  # named capsule-<tenant>-<index>. Phase 9 verifies SHAPE only; enforcement
  # semantics (N6 quota violation) deferred to Phase 11.
  resourceQuotas:
    items:
      - hard:
          cpu: "4"
          memory: 8Gi
          pods: "20"
  # TEN-03 — LimitRange auto-materialization shape
  limitRanges:
    items:
      - limits:
          - type: Container
            default:
              cpu: 100m
              memory: 128Mi
            defaultRequest:
              cpu: 50m
              memory: 64Mi
  # N6 fixture (Phase 11 -- VAL-01 N6 quota falsifier; Claude's Discretion per CONTEXT.md):
  # tenant-bravo (home) + bravo-app1 (Phase 9 TEN-02) = 2; symmetric with alpha for N6 falsifier.
  # Schema: NamespaceOptions struct: Quota *int32 (kubebuilder:Minimum=1) -- verified RESEARCH.md.
  namespaceOptions:
    quota: 3
  # N7 fixture (Phase 11 -- VAL-01 N7 registry-violation falsifier; Claude's Discretion per CONTEXT.md):
  # Symmetric with alpha so cross-tenant registry-allowlist parity holds for negative-rbac suite.
  # Schema: AllowedListSpec struct: { allowed: []string, allowedRegex: string } -- verified RESEARCH.md.
  # NOTE: ContainerRegistries field is marked deprecated in v0.12.4 (use Enforcement.Registries)
  # but the deprecated form still works for POC purposes.
  containerRegistries:
    allowed:
      - registry.example.io
  # No additionalRoleBindings, storageClasses, ingressClasses, nodeSelector, networkPolicies --
  # Capsule defaults to allow-all (per CONTEXT.md Claude's Discretion).
