# pocs/capsule/spoke/tenant-claims/alpha/namespace.yaml
# D-11-07 live repair: tenant claim is applied by the Tenant owner SA, not by
# cluster bootstrap flux-reconciler, because Capsule rejects tenant assignment
# by non-owner identities.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-alpha
  labels:
    capsule.clastix.io/tenant: alpha
