# pocs/capsule/spoke/global-resources/hello-world.yaml
# GlobalTenantResource that auto-propagates a hello-world Deployment + Service
# into every tenant namespace (shape amended 2026-07-06).
#
# Contract: propagation to all tenant namespaces, <=60s for a fresh tenant,
# single workload + Service ONLY (no extra ConfigMap).
#
# AMENDED 2026-07-06 (was "Pod + Service" — see
# docs/adr/0008-capsule-multi-tenancy-graduation.md): the original bare-Pod
# rawItem put capsule-controller-manager into a PERMANENT error loop — every
# resync re-sends the sparse Pod spec as an UPDATE, which the apiserver rejects
# ("pod updates may not change fields other than image...") because live Pods
# carry server-populated immutable fields (nodeName, projected SA token volume,
# ...). GlobalTenantResource has NO update-skip option (spec =
# tenantSelector/resyncPeriod/pruningOnDelete/resources only), so the seeded
# workload MUST have a mutable spec: a 1-replica Deployment. Deployment churn
# was weighed against a controller stuck in exponential backoff (masking real
# GTR failures) — the loop loses.
# NEVER seed bare Pods (or Jobs — also immutable) via GTR rawItems.
#
# Propagation outside intended tenants is mitigated by the explicit match-all
# selector (canonical k8s pattern); proxy LIST scopes visibility; bats
# seed-02-live verifies the exact namespace set.
#
# CRITICAL: image MUST be FQCI (docker.io/library/nginx:alpine).
# Capsule's containerRegistries enforcement webhook matches on the registry
# prefix and rejects non-FQCI images even when `docker.io` is in
# `containerRegistries.allowed`. `docker.io` was added to alpha + bravo
# `containerRegistries.allowed` (additive — the negative-RBAC registry fixture
# tests a DIFFERENT arbitrary registry and still asserts rejection).
#
# Apply ordering — pocs/capsule/spoke/kustomization.yaml has FIFO sortOptions +
# global-resources/ AFTER tenants/, so alpha + bravo home namespaces exist when
# the controller first reconciles. For new tenants created via new-tenant.sh,
# the GTR controller watches Tenant resources and enqueues a reconcile when
# Tenant.Status.Namespaces becomes non-empty.
#
# pruningOnDelete: true (default) means tenant deletion unmaterializes
# propagated copies — the cleanup race is mitigated in the seed bats teardown
# via `kubectl wait --for=delete --timeout=30s`.
#
# CRD schema verified against:
#   https://raw.githubusercontent.com/projectcapsule/capsule/v0.12.4/
#     charts/capsule/crds/capsule.clastix.io_globaltenantresources.yaml
# Live CRD installed since 2026-04-30 (storage version v1beta2).
apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: hello-world-seeded
  labels:
    karyon.io/poc: capsule
spec:
  tenantSelector:
    matchLabels: {}                 # match-all (canonical k8s pattern)
  resyncPeriod: 60s                 # default; explicit for the 60s propagation SLO
  pruningOnDelete: true             # default; explicit — tenant deletion prunes propagated copies
  resources:
    - additionalMetadata:
        labels:
          karyon.io/managed-by: capsule-global-tenant-resource
          karyon.io/poc: capsule
      rawItems:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: hello-world
            labels:
              app: hello-world
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: hello-world
            template:
              metadata:
                labels:
                  app: hello-world
              spec:
                containers:
                  - name: nginx
                    image: docker.io/library/nginx:alpine
                    ports:
                      - containerPort: 80
                        name: http
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 100m
                        memory: 128Mi
        - apiVersion: v1
          kind: Service
          metadata:
            name: hello-world
            labels:
              app: hello-world
          spec:
            type: ClusterIP
            selector:
              app: hello-world
            ports:
              - port: 80
                targetPort: http
                protocol: TCP
