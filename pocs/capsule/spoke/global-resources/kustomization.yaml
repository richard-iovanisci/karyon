# pocs/capsule/spoke/global-resources/kustomization.yaml
# Local Kustomize aggregator for the spoke-side global-resources subdir.
# Resolved by parent pocs/capsule/spoke/kustomization.yaml.
#
# GlobalTenantResource (cluster-scoped Capsule CR) with embedded
# Deployment + Service propagated to every tenant namespace (shape amended from
# a bare Pod on 2026-07-06 — immutable Pod specs put the controller in a
# permanent resync error loop; see
# docs/adr/0008-capsule-multi-tenancy-graduation.md). Spoke-targeted (parent
# capsule-spoke.yaml's spec.kubeConfig: spoke-capsule-kubeconfig + spec.path:
# ./pocs/capsule/spoke routes these resources to spoke-capsule via
# kustomize-controller's cross-cluster reconcile).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - hello-world.yaml
