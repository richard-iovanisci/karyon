# pocs/capsule/spoke/tenants/kustomization.yaml
# Aggregator for both tenant subdirs.
#
# Spoke-targeted: parent pocs/capsule/spoke/kustomization.yaml resolves this
# under the poc-capsule-spoke outer K's kubeConfig (apply to spoke-capsule via
# the split-path pattern).
#
# This path contains tenant home Namespaces + SAs only.
# Tenant CRs land first via pocs/capsule/spoke/tenant-crs/ and the separate
# poc-capsule-spoke-tenants outer K.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
sortOptions:
  order: fifo
resources:
  - alpha/
  - bravo/
