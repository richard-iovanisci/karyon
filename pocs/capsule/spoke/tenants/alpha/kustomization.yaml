# pocs/capsule/spoke/tenants/alpha/kustomization.yaml
# Local Kustomize aggregator for tenant alpha's spoke-side resources.
#
# D-09-01 — alpha subdir under pocs/capsule/spoke/tenants/. Mirror exists at
# pocs/capsule/spoke/tenants/bravo/.
#
# D-11-07 live repair — Tenant/alpha moved to pocs/capsule/spoke/tenant-crs/.
# This K applies only the labeled home namespace and its owner SA after the
# separate poc-capsule-spoke-tenants K has made Tenant/alpha live.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
sortOptions:
  order: fifo
resources:
  - namespace.yaml
  - sa.yaml
