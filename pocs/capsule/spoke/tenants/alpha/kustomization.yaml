# pocs/capsule/spoke/tenants/alpha/kustomization.yaml
# Local Kustomize aggregator for tenant alpha's spoke-side resources.
# Mirror exists at pocs/capsule/spoke/tenants/bravo/.
#
# Tenant/alpha itself lives in pocs/capsule/spoke/tenant-crs/.
# This K applies only the labeled home namespace and its owner SAs after the
# separate poc-capsule-spoke-tenants K has made Tenant/alpha live.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
sortOptions:
  order: fifo
resources:
  - namespace.yaml
  - sa.yaml
  # human-tenant-owner SA — binding target for tenant-workload-editor
  - human-owner-sa.yaml
