# pocs/capsule/spoke/tenants/bravo/namespace.yaml
# The tenant home namespace on spoke-capsule. Holds the gitops-reconciler
# SA that the Tenant CR registers as ServiceAccount owner.
#
# Tenant home namespace name pattern: tenant-<tenant-name>.
# The tenant's auto-created child namespaces use prefix <tenant-name>- (e.g. bravo-app1)
# enforced by spec.forceTenantPrefix in the Tenant CR.
#
# The inline tenant label is applied by the bootstrap
# flux-system/flux-reconciler SA. That SA is explicitly listed as a Tenant/bravo
# owner so Capsule accepts the namespace assignment during GitOps bootstrap.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-bravo
  labels:
    capsule.clastix.io/tenant: bravo
