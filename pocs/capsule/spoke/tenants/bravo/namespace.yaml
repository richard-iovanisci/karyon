# pocs/capsule/spoke/tenants/bravo/namespace.yaml
# TEN-01 -- the tenant home namespace on spoke-capsule. Holds the gitops-reconciler
# SA that the Tenant CR registers as ServiceAccount owner.
#
# D-09-02 -- tenant home namespace name pattern: tenant-<tenant-name>.
# The tenant's auto-created child namespaces use prefix <tenant-name>- (e.g. bravo-app1)
# enforced by spec.forceTenantPrefix in the Tenant CR.
#
# D-11-07 live repair -- this bootstrap namespace is intentionally unlabelled.
# The tenant claim label lands later from pocs/capsule/spoke/tenant-claims/bravo/
# through tenant-bravo-home, which impersonates the Tenant owner SA. Capsule rejects
# tenant assignment by the non-owner flux-reconciler bootstrap identity.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-bravo
