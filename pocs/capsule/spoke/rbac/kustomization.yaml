# pocs/capsule/spoke/rbac/kustomization.yaml
# Local Kustomize aggregator for the spoke-side rbac subdir (2026-05-06).
# Resolved by parent pocs/capsule/spoke/kustomization.yaml (which lists rbac/
# FIRST as defense in depth) AND by the top-level Flux Kustomization
# clusters/hub-flux/pocs/capsule-spoke-rbac.yaml which targets just this rbac/
# subdir with NO dependsOn on poc-capsule (deterministic ordering at the Flux K
# layer, not just inside one K's apply).
#
# Ordering within this file: namespace.yaml MUST be first so the capsule-system Namespace
# lands BEFORE the ServiceAccount that targets it (without this, a clean-spoke
# first-reconcile hits "namespace not found" before the SA can be created).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-controller-sa.yaml
  # platform-owner SA BEFORE platform-owner.yaml so the SA referenced in the
  # dual-subject ClusterRoleBinding lands first on clean reconcile.
  - platform-owner-sa.yaml
  - platform-owner.yaml
  # Tier 3 RBAC narrowing — narrower than upstream k8s edit
  - tenant-workload-editor.yaml
