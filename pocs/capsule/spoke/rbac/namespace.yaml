# pocs/capsule/spoke/rbac/namespace.yaml
# Spoke-side capsule-system Namespace (2026-05-06).
#
# Background: pocs/capsule/namespace.yaml covers the HUB-targeted path
# (so kustomize-controller has a namespace before HR/OCIRepo CRs are applied on hub).
# But the SPOKE-targeted path (pocs/capsule/spoke/) had NO capsule-system Namespace
# resource. On a clean spoke, the rbac Kustomization would fail with "namespace not
# found" before the helm-controller ServiceAccount could be created -- and helm-controller
# (running on hub-flux) needs that SA to exist on spoke for spec.serviceAccountName
# impersonation to succeed.
#
# Ordering: This Namespace is listed FIRST in pocs/capsule/spoke/rbac/kustomization.yaml
# resources list, so the namespace lands BEFORE helm-controller-sa.yaml within the same
# kustomize-build output on a clean spoke. The Flux SSA policy is intentionally
# IfNotPresent: when capsule-system already exists, Flux must NOT patch it because the
# Capsule namespaces webhook rejects non-tenant namespace patches. This preserves the
# clean-spoke bootstrap guard without fighting Capsule-owned admission on existing
# clusters. Defense in depth: the entire rbac/ subdir lands as a separate Flux
# Kustomization (clusters/hub-flux/pocs/capsule-spoke-rbac.yaml) with NO dependsOn on
# poc-capsule, ensuring this Namespace + the helm-controller SA reach spoke BEFORE the
# HelmReleases are picked up by helm-controller.
apiVersion: v1
kind: Namespace
metadata:
  name: capsule-system
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    karyon.io/managed-by: flux
    karyon.io/poc: capsule
