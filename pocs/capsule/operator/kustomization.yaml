# pocs/capsule/operator/kustomization.yaml
# Local Kustomize aggregator for the operator subdir — resolved by the parent
# pocs/capsule/kustomization.yaml.
# Sets namespace: capsule-system as belt-and-suspenders (the OCIRepository + HelmRelease
# both already declare metadata.namespace: capsule-system in their own files).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: capsule-system
resources:
  - ocirepository.yaml
  - helmrelease.yaml
