# pocs/capsule/operator/ocirepository.yaml
# Capsule operator chart source — Flux v1 OCIRepository pinning oci://ghcr.io/projectcapsule/charts/capsule:0.12.4
#
# Verified shapes (2026-04-29):
#   - apiVersion source.toolkit.fluxcd.io/v1: fluxcd.io/flux/components/source/api/v1/
#   - chart values surface: helm show values oci://ghcr.io/projectcapsule/charts/capsule --version 0.12.4
#   - layerSelector.mediaType is the canonical Helm chart layer (fluxcd.io/flux/components/source/ocirepositories/)
#
# D-08-02 — per-chart OCIRepository (NOT shared with capsule-proxy; capsule-proxy has its own at pocs/capsule/proxy/ocirepository.yaml)
# D-08-06 — interval 24h is sufficient for digest-pinned chart sources (no semver poll churn)
# CAP-01 — digest-pinned (see .planning/debug/capsule-tenant-ns-claim.md):
#   tag "0.12.4" alone is MUTABLE — upstream registry could repackage the artifact silently.
#   Pinning by digest makes Flux reconcile reproducible across cold rebuilds.
#   Tag kept alongside digest for human readability; digest is authoritative per OCI spec.
#   Current digest captured 2026-05-27 from `kubectl -n capsule-system get ocirepository capsule -o jsonpath='{.status.artifact.revision}'`.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: capsule
  namespace: capsule-system
spec:
  interval: 24h
  url: oci://ghcr.io/projectcapsule/charts/capsule
  ref:
    tag: "0.12.4"
    digest: "sha256:56638ab8bf455c5a1f5cf581c474681147cfe7031a0ff902a42c3715f0011fb7"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
