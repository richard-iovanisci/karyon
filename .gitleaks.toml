# .gitleaks.toml
# Allow-rules for the gitleaks pre-commit hook (hooks/pre-commit) and the CI
# gitleaks-scan job. Expand only when a NEW false positive is observed AND the
# flagged value is verified to be a placeholder, never a rotated real secret.

[allowlist]
description = "False positives: placeholder tokens and synthetic fixtures"
regexes = [
  '''ghp_REPLACE_WITH_PAT_WITH_repo_SCOPE''',  # .env.example placeholder
]
paths = [
  '''^\.env\.example$''',                                                                                        # whole-file allow: placeholder-only template
  # HISTORY-ONLY ENTRIES. The fourteen .planning/... paths below point at
  # retired planning documents that quoted the synthetic kubeconfig fixture.
  # The .planning/ directory was deleted from the working tree in July 2026,
  # but CI scans the FULL git history (`gitleaks git --log-opts=--all` with
  # fetch-depth 0), and the files remain in historical commits at both their
  # original (phases/) and archived (milestones/) locations. Removing any
  # entry re-flags those historical blobs and fails CI. Keep all fourteen
  # unless git history is ever rewritten.
  # The entries are deliberately file-specific: one broad pattern covering
  # every planning markdown file would have hidden exactly the
  # accidental-leak class this config exists to catch. push-gate-05 bats
  # enforces both properties (entries present; no broad pattern anywhere in
  # this file, comments included).
  '''^\.planning/phases/07-foundation-poc-seam-spoke-capsule-cluster-eks-capsule-doc/07-00-PLAN\.md$''',         # history-only
  '''^\.planning/phases/07-foundation-poc-seam-spoke-capsule-cluster-eks-capsule-doc/07-RESEARCH\.md$''',        # history-only
  '''^\.planning/phases/07-foundation-poc-seam-spoke-capsule-cluster-eks-capsule-doc/07-REVIEW\.md$''',          # history-only
  '''^\.planning/phases/07-foundation-poc-seam-spoke-capsule-cluster-eks-capsule-doc/07-PATTERNS\.md$''',        # history-only
  '''^\.planning/phases/10-tenant-owner-kubeconfigs-capsule-proxy-round-trip/10-00-PLAN\.md$''',                 # history-only
  '''^\.planning/phases/10-tenant-owner-kubeconfigs-capsule-proxy-round-trip/10-REVIEW\.md$''',                  # history-only
  '''^\.planning/phases/10-tenant-owner-kubeconfigs-capsule-proxy-round-trip/10-PATTERNS\.md$''',                # history-only
  '''^\.planning/milestones/v0\.19-phases/07-foundation-poc-seam-spoke-capsule-cluster-eks-capsule-doc/07-00-PLAN\.md$''',   # history-only (archived location)
  '''^\.planning/milestones/v0\.19-phases/07-foundation-poc-seam-spoke-capsule-cluster-eks-capsule-doc/07-RESEARCH\.md$''',  # history-only (archived location)
  '''^\.planning/milestones/v0\.19-phases/07-foundation-poc-seam-spoke-capsule-cluster-eks-capsule-doc/07-REVIEW\.md$''',    # history-only (archived location)
  '''^\.planning/milestones/v0\.19-phases/07-foundation-poc-seam-spoke-capsule-cluster-eks-capsule-doc/07-PATTERNS\.md$''',  # history-only (archived location)
  '''^\.planning/milestones/v0\.19-phases/10-tenant-owner-kubeconfigs-capsule-proxy-round-trip/10-00-PLAN\.md$''',           # history-only (archived location)
  '''^\.planning/milestones/v0\.19-phases/10-tenant-owner-kubeconfigs-capsule-proxy-round-trip/10-REVIEW\.md$''',            # history-only (archived location)
  '''^\.planning/milestones/v0\.19-phases/10-tenant-owner-kubeconfigs-capsule-proxy-round-trip/10-PATTERNS\.md$''',          # history-only (archived location)
  # proxy-06-live-fixture.bats deliberately embeds a kubeconfig-shaped heredoc
  # (written only to BATS_TEST_TMPDIR, never in-repo) to prove gitleaks fires
  # on the unallowlisted shape. The heredoc literal lives in the suite's
  # source, so the suite file itself needs a path allow.
  '''^tests/bats/proxy-06-live-fixture\.bats$''',
]

# Custom rule: kubeconfig-shaped artifact with an embedded bearer token.
# The multi-line regex needs gitleaks >= 8.25 for (?ms); the repo pins 8.30.1
# in .tool-versions. tests/fixtures/gitleaks/synthetic-kubeconfig.yaml is the
# positive-test fixture (allowlisted below so it can live in the repo).

[[rules]]
id = "kubeconfig-bearer-token"
description = "Kubernetes kubeconfig with embedded bearer token (kind: Config + users.token)"
regex = '''(?ms)^kind:\s*Config[\s\S]*?users:[\s\S]*?token:\s*[A-Za-z0-9._-]{32,}'''
tags = ["kubernetes", "kubeconfig", "bearer-token"]

[rules.allowlist]
description = "Synthetic fixture (verified inert; positive-test only)"
paths = [
  '''^tests/fixtures/gitleaks/synthetic-kubeconfig\.yaml$''',
]
