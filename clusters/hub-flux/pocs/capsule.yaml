# clusters/hub-flux/pocs/capsule.yaml
# Flux v1 Kustomization (HUB-TARGETED) — hub-flux's kustomize-controller reconciles
# pocs/capsule/ into hub-flux's own apiserver. HelmRelease + OCIRepository CRs land on
# hub-flux where helm-controller can pick them up; each HR's own spec.kubeConfig
# redirects helm-install actions to spoke-capsule (standard Flux remote-cluster pattern).
#
# Split-path invariant (2026-04-29):
# - Spoke-targeted Kustomizations MUST carry the full spec.kubeConfig block
#   (secret key value.yaml). Without it, kustomize-controller falls back to its
#   in-cluster SA and silently reconciles the path into the HUB while reporting
#   Ready — the silent-misroute fault.
# - Hub-targeted Kustomizations MUST NOT carry spec.kubeConfig: spoke-capsule has
#   zero Flux CRDs (hub-only Flux control plane — see
#   docs/adr/0004-hub-only-flux-control-plane.md), so redirecting this apply to
#   the spoke fails with `no matches for kind "HelmRelease" in version
#   "helm.toolkit.fluxcd.io/v2"` (verified by server-side dry-run against
#   pocs/capsule/operator/helmrelease.yaml).
# - serviceAccountName MUST be explicit: the hub lockdown flag
#   --default-service-account=default makes any Kustomization CR without
#   spec.serviceAccountName reconcile as the no-permission `default` SA.
#   poc-capsule is hub-targeted, so it uses `kustomize-controller` — the hub
#   bootstrap SA (cluster-admin via the flux-system ClusterRoleBinding). Without
#   this the reconcile bricks immediately.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: poc-capsule
  namespace: flux-system
spec:
  interval: 5m
  path: ./pocs/capsule
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  serviceAccountName: kustomize-controller
  # Note (2026-05-06): the PostBuild RBAC patch for the chart-rendered proxy Role
  # lives in pocs/capsule/proxy/helmrelease.yaml spec.postRenderers, NOT here.
  # Kustomization spec.patches only modify kustomize-build output (raw YAML in
  # path); the Role is rendered by helm-controller from the Helm chart, so
  # postRenderers is the correct Flux mechanism for patching chart output.
