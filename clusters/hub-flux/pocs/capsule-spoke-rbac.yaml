# clusters/hub-flux/pocs/capsule-spoke-rbac.yaml
# Separate spoke-targeted Flux Kustomization for the spoke-side rbac/ subdir
# bootstrap (2026-05-06).
#
# Why a separate K (not just rbac/ inside pocs/capsule/spoke/kustomization.yaml):
# That intra-K ordering only governs apply order INSIDE poc-capsule-spoke. The
# HelmReleases come from the SEPARATE poc-capsule (hub-targeted) Kustomization and
# helm-controller can pick them up BEFORE poc-capsule-spoke has applied rbac. Splitting
# rbac into its own outer K with NO dependsOn on poc-capsule makes ordering deterministic
# at the Flux K layer:
#   1. poc-capsule-spoke-rbac reconciles first (no dependsOn -> ready immediately);
#      provisions capsule-system Namespace + helm-controller SA + cluster-admin CRB on spoke
#   2. poc-capsule reconciles its HR/OCIRepo CRs to hub (no dependsOn on rbac because the
#      CRs themselves don't need spoke rbac to APPLY to hub -- only the helm-controller's
#      spoke-side ACTION needs it, which happens AFTER the CR is on hub)
#   3. helm-controller picks up the HRs and impersonates `helm-controller` SA on spoke.
#      The SA exists (provisioned by step 1), so impersonation succeeds.
#   4. poc-capsule-spoke (tenant CRs + config) dependsOn poc-capsule-spoke-rbac AND poc-capsule;
#      both must be Ready=True before tenant CRs land.
#
# spec.serviceAccountName: flux-reconciler -- POC spokes only have the
# flux-reconciler SA (provisioned by scripts/register-poc-cluster.sh). Using that
# name makes Flux's kustomize-controller impersonation valid on the target cluster.
#
# spec.path: ./pocs/capsule/spoke/rbac -- narrowly scopes this K to the rbac/ subdir only;
# pocs/capsule/spoke/kustomization.yaml's broader resource list still applies to
# poc-capsule-spoke (which dependsOn this rbac K) but is itself a defense-in-depth pass.
#
# Spoke-targeted: ALWAYS include the entire spec.kubeConfig block with explicit
# key: value.yaml (same shape as capsule-spoke.yaml) — omitting it silently
# reconciles into the hub while reporting Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: poc-capsule-spoke-rbac
  namespace: flux-system
spec:
  interval: 5m
  path: ./pocs/capsule/spoke/rbac
  prune: true
  serviceAccountName: flux-reconciler   # the SA provisioned on spoke by register-poc-cluster.sh
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  kubeConfig:
    secretRef:
      name: spoke-capsule-kubeconfig
      key: value.yaml
