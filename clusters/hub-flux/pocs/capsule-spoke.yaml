# clusters/hub-flux/pocs/capsule-spoke.yaml
# Flux v1 Kustomization (SPOKE-TARGETED) — hub-flux's kustomize-controller reconciles
# pocs/capsule/spoke/ into k3d-spoke-capsule via the spoke-capsule-kubeconfig Secret
# (applied imperatively by scripts/register-poc-cluster.sh; never committed because it
# contains a bearer token).
#
# Split-path invariant (2026-04-29): the full spec.kubeConfig block lives HERE
# (spoke-targeted K), not on capsule.yaml (hub-targeted K). hub-flux holds the Flux
# CRDs + helm-controller (docs/adr/0004-hub-only-flux-control-plane.md); CRs that
# must land on the spoke (Tenant CRs and beyond) route through this K via kubeConfig
# impersonation, while CRs that must land on hub (HelmRelease + OCIRepository) route
# through capsule.yaml without kubeConfig. Omitting spec.kubeConfig on a
# spoke-targeted K makes kustomize-controller fall back to its in-cluster SA and
# silently reconcile into the HUB while reporting Ready — ALWAYS include the entire
# block, with explicit `key: value.yaml` as belt-and-suspenders against future Flux
# default-key changes.
#
# dependsOn poc-capsule + wait: true (TOP-LEVEL field — wait is NOT a sub-field of
# dependsOn entries) + timeout 10m: Tenant CRs (under pocs/capsule/spoke/tenants/)
# cannot apply until the operator HelmRelease has reconciled and the Capsule CRDs
# are registered on the spoke. poc-capsule's reconcile drives the operator HR →
# CRD registration; wait: true blocks this K's apply until poc-capsule is
# Ready=True.
#
# serviceAccountName correction (2026-05-06): with spec.kubeConfig +
# spec.serviceAccountName set, Flux's kustomize-controller IMPERSONATES the named
# SA on the TARGET cluster (here: spoke-capsule). POC spokes ONLY have the
# `flux-reconciler` SA + cluster-admin CRB (provisioned by
# scripts/register-poc-cluster.sh and scripts/register-spokes-for-flux.sh; see the
# analog clusters/hub-flux/spokes/spoke-apps.yaml which also uses flux-reconciler).
# Any other name makes the impersonation invalid on the target cluster.
#
# dependsOn poc-capsule-spoke-tenants (live repair): Tenant CRs must be live before
# this K applies tenant home Namespaces labeled capsule.clastix.io/tenant=<name>;
# Flux dry-runs a whole Kustomization batch before applying, so same-batch ordering
# is insufficient — Capsule's webhook rejects a labeled namespace whose Tenant CR
# does not exist yet.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: poc-capsule-spoke
  namespace: flux-system
spec:
  interval: 5m
  path: ./pocs/capsule/spoke
  prune: true
  serviceAccountName: flux-reconciler
  dependsOn:
    - name: poc-capsule-spoke-rbac   # spoke rbac (Namespace + helm-controller SA) must land BEFORE any tenant or config CR
    - name: poc-capsule   # operator HR must be Ready so Capsule CRDs exist on spoke (no namespace needed; same flux-system ns)
    - name: poc-capsule-spoke-tenants   # Tenant CRs must exist before labeled tenant Namespaces dry-run/apply
  wait: true                # TOP-LEVEL spec.wait, NOT inside dependsOn entry
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  kubeConfig:
    secretRef:
      name: spoke-capsule-kubeconfig
      key: value.yaml
