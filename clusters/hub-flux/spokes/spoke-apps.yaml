# clusters/hub-flux/spokes/spoke-apps.yaml
# Flux v1 Kustomization - hub-flux's kustomize-controller reconciles
# clusters/spoke-apps/ into k3d-spoke-apps via the spoke-apps-kubeconfig Secret
# (applied imperatively by scripts/register-spokes-for-flux.sh).
#
# REQ-SPOKE-05 + REQ-SPOKE-04 (per spoke-ml.yaml header - same rationale).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spoke-apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/spoke-apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  kubeConfig:
    secretRef:
      name: spoke-apps-kubeconfig
      key: value.yaml
